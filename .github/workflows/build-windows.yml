name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Zbuduj EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MouseSyncDelay mouse_sync_delay.py

      - name: Udostępnij EXE
        uses: actions/upload-artifact@v4
        with:
          name: MouseSyncDelay-Windows-x64
          path: dist/MouseSyncDelay.exe
